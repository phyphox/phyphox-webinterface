                        buttons += "<button type=\"button\" class=\"pickOutput\" onclick=\"PhyphoxGraph.pickOutput(" + g.index + ", " + i + ", event)\">" + escapeHTML(out.label || out.buffer) + "</button>";
                    });
                    lines.push("<span class=\"pickOutputs\">" + buttons + "</span>");
                    if (g.pendingCal) {
                        var out = cfg.pickOutputs[g.pendingCal.outputIndex];
                        lines.push("<span class=\"pickCal\">" + escapeHTML(out.calLabel || out.calBuffer) + "<br/>" +
                            "<input type=\"text\" inputmode=\"decimal\" class=\"pickCalInput\" value=\"" + escapeHTML(g.pendingCal.value) + "\" " +
                            "onkeydown=\"if (event.key == 'Enter') PhyphoxGraph.commitCal(" + g.index + ", event)\"/> " +
                            "<button type=\"button\" onclick=\"PhyphoxGraph.commitCal(" + g.index + ", event)\">" + escapeHTML(graphStrings.ok) + "</button> " +
                            "<button type=\"button\" onclick=\"PhyphoxGraph.cancelCal(" + g.index + ", event)\">" + escapeHTML(graphStrings.cancel) + "</button>" +
                            (g.pendingCal.error ? "<br/><span class=\"pickError\">" + escapeHTML(graphStrings.invalidValue) + "</span>" : "") +
                            "</span>");
                    }
                }
            }
            //Only touch the DOM when the content changed, so an input the user is typing in survives the data updates
            var html = lines.join("<br/>");
            if (html !== g.infoHTML) {
                g.infoHTML = html;
                box.innerHTML = html;
                box.style.display = html == "" ? "none" : "block";
            }
            var input = box.getElementsByClassName("pickCalInput")[0];
            if (input && g.pendingCal && g.pendingCal.focus) {
                g.pendingCal.focus = false;
                input.focus();
            }
            positionInfo(g, box);
        }

        //With picks the box sits next to the last picked point, like the popup in the app
        function positionInfo(g, box) {
            if (!g.chart || g.picks.length == 0 || box.style.display == "none") {
                box.style.left = "";
                box.style.top = "";
                return;
            }
            var chart = g.chart;
            var xs = chart.scales.x, ys = chart.scales.y;
            var last = g.picks[g.picks.length - 1];
            var px = xs.getPixelForValue(last.x);
            var py = ys.getPixelForValue(last.y);
            var area = chart.chartArea;
            var w = box.offsetWidth, h = box.offsetHeight;
            var gap = 16 * scaleFactor;
            var others = g.picks.slice(0, -1).map(function(p) { return {x: xs.getPixelForValue(p.x), y: ys.getPixelForValue(p.y)}; });
            //Right of the point, or left if that fits better or keeps the other marker visible
            var candidates = [px + gap, px - gap - w];
            var left = null;
            for (var i = 0; i < candidates.length && left === null; i++) {
                var l = candidates[i];
                if (l < area.left || l + w > area.right)
                    continue;
                var t0 = Math.min(Math.max(py - h / 2, area.top), area.bottom - h);
                var covers = others.some(function(o) { return o.x > l - gap && o.x < l + w + gap && o.y > t0 - gap && o.y < t0 + h + gap; });
                if (!covers)
                    left = l;
            }
            if (left === null)
                left = candidates[0] + w <= area.right ? candidates[0] : Math.max(area.left, candidates[1]);
            var top = py - h / 2;
            if (top + h > area.bottom)
                top = area.bottom - h;
            if (top < area.top)
                top = area.top;
            box.style.left = Math.round(left) + "px";
            box.style.top = Math.round(top) + "px";
        }

        function pickValueForOutput(g, out) {
            var p = g.picks[g.picks.length - 1];
            if (!p)
                return null;
            switch (out.axis) {
                case "x": return p.x;
                case "y": return p.y;
                case "z": return p.z;
            }
            return null;
        }

        function pickOutput(index, outputIndex, event) {
            var g = graphs[index];
            if (!g)
                return;
            if (event)
                event.stopPropagation();
            var out = g.cfg.pickOutputs[outputIndex];
            if (!out)
                return;
            if (out.calBuffer) {
                //The user assigns a value to the picked point, asked for inline
                g.pendingCal = {outputIndex: outputIndex, value: "", error: false, focus: true};
                updateInfo(g);
                return;
            }
            writePick(g, out, null);
        }

        function commitCal(index, event) {
            var g = graphs[index];
            if (!g || !g.pendingCal)
                return;
            if (event)
                event.stopPropagation();
            var box = infoBox(g);
            var input = box ? box.getElementsByClassName("pickCalInput")[0] : null;
            if (!input)
                return;
            var text = input.value.trim().replace(",", ".");
            var v = parseFloat(text);
            if (text == "" || !isFinite(v) || !/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(text)) {
                g.pendingCal.value = input.value;
                g.pendingCal.error = true;
                g.pendingCal.focus = true;
                updateInfo(g);
                return;
            }
            var out = g.cfg.pickOutputs[g.pendingCal.outputIndex];
            g.pendingCal = null;
            writePick(g, out, v);
        }

        function clearPicks(index, event) {
            var g = graphs[index];
            if (!g)
                return;
            if (event)
                event.stopPropagation();
            g.picks = [];
            g.pendingCal = null;
            if (g.chart)
                g.chart.update("none");
            updateInfo(g);
        }

        function cancelCal(index, event) {
            var g = graphs[index];
            if (!g)
                return;
            if (event)
                event.stopPropagation();
            g.pendingCal = null;
            updateInfo(g);
        }

        //Writes the picked value (and the assigned value) into the output buffers, replacing their contents
        function writePick(g, out, userValue) {
            var v = pickValueForOutput(g, out);
            if (!isFiniteNumber(v))
                return;
            var buffers = {};
            buffers[out.buffer] = [v];
            if (out.calBuffer && userValue !== null)
                buffers[out.calBuffer] = [userValue];
            ajaxPostJSON("set", {buffers: buffers, mode: "replace"}, null, function() {
                errorNode.textContent = "Update failed! Please check your connection.";
                errorNode.style.display = "block";
            });
            updateInfo(g);
        }

        function onMeasuringChanged(nowMeasuring) {
            //A new start adds a time reference event
            var needed = false;
            for (var i in graphs) {
                if (graphs[i].systemTime)
                    needed = true;
            }
            if (needed)
                requestTimeEvents(true);
        }

        /*
         * Chart.js plugin: plot frame, color maps with their scale, pick markers and empty-plot messages
         */

        function drawColorMap(chart, g) {
            var cfg = g.cfg;
            var meta = null, ds = null, dsIndex = -1;
            for (var i = 0; i < chart.data.datasets.length; i++) {
                if (chart.data.datasets[i].phyphoxStyle == "map") {
                    ds = chart.data.datasets[i];
                    dsIndex = i;
                    break;
                }
            }
            if (!ds || !g.mapZ)
                return;
            var points = ds.data;
            var mapWidth = cfg.mapWidth > 0 ? cfg.mapWidth : 0;
            if (mapWidth < 1)
                return;
            var mapHeight = Math.floor(points.length / mapWidth);
            if (mapHeight < 2)
                return;
            var colorScale = (cfg.colorScale && cfg.colorScale.length > 1 ? cfg.colorScale : ["#000000", "#ff7e22", "#ffffff"]).map(stringToRGB);
            var interpolate = cfg.interpolateMapColors !== false;

            var minZ = g.mapZ.min, maxZ = g.mapZ.max;
            var logZ = g.mapZ.log;
            if (logZ) {
                minZ = Math.log(Math.max(minZ, 1e-12));
                maxZ = Math.log(Math.max(maxZ, 1e-12));
            }
            if (!(maxZ > minZ))
                maxZ = minZ + 1;

            var mapCanvas = document.createElement("canvas");
            mapCanvas.width = mapWidth;
            mapCanvas.height = mapHeight;
            var mapctx = mapCanvas.getContext("2d");
            var img = mapctx.createImageData(mapWidth, mapHeight);
            var onScaleFactor = (colorScale.length - 1) / (maxZ - minZ);
            for (var i = 0; i < mapWidth * mapHeight; i++) {
                var z = points[i].z;
                if (!isFiniteNumber(z))
                    continue;
                if (logZ) {
                    if (z < 1e-12)
                        continue;
                    z = Math.log(z);
                }
                var onColorScale = (z - minZ) * onScaleFactor;
                var index = Math.floor(onColorScale);
                if (index > colorScale.length - 2)
                    index = colorScale.length - 2;
                else if (index < 0)
                    index = 0;
                var inbetween = onColorScale - index;
                if (inbetween > 1) inbetween = 1;
                else if (inbetween < 0) inbetween = 0;
                if (!interpolate)
                    inbetween = Math.round(inbetween);
                var c1 = colorScale[index], c2 = colorScale[index + 1];
                img.data[4*i] = Math.round(c1.r * (1 - inbetween) + c2.r * inbetween);
                img.data[4*i+1] = Math.round(c1.g * (1 - inbetween) + c2.g * inbetween);
                img.data[4*i+2] = Math.round(c1.b * (1 - inbetween) + c2.b * inbetween);
                img.data[4*i+3] = Math.round(255 * (c1.a * (1 - inbetween) + c2.a * inbetween));
            }
            mapctx.putImageData(img, 0, 0);

            //Place the lattice by its corner values on the current axes, so zooming works with the map as well
            var xs = chart.scales.x, ys = chart.scales.y;
            var first = points[0], lastRowStart = points[(mapHeight - 1) * mapWidth];
            var x0 = first.x, x1 = points[mapWidth - 1].x;
            var y0 = first.y, y1 = lastRowStart.y;
            if (!isFiniteNumber(x0) || !isFiniteNumber(x1) || !isFiniteNumber(y0) || !isFiniteNumber(y1))
                return;
            //Extend by half a cell so the outermost samples are centered on their cells
            var cellX = mapWidth > 1 ? (x1 - x0) / (mapWidth - 1) : 0;
            var cellY = mapHeight > 1 ? (y1 - y0) / (mapHeight - 1) : 0;
            var px0 = xs.getPixelForValue(x0 - cellX / 2), px1 = xs.getPixelForValue(x1 + cellX / 2);
            var py0 = ys.getPixelForValue(y0 - cellY / 2), py1 = ys.getPixelForValue(y1 + cellY / 2);

            var ctx = chart.ctx;
            var area = chart.chartArea;
            ctx.save();
            ctx.beginPath();
            ctx.rect(area.left, area.top, area.right - area.left, area.bottom - area.top);
            ctx.clip();
            ctx.imageSmoothingEnabled = false;
            ctx.translate(Math.min(px0, px1), Math.min(py0, py1));
            ctx.scale((px1 - px0) / mapWidth * Math.sign(px1 - px0) || 1, (py1 - py0) / mapHeight * Math.sign(py1 - py0) || 1);
            if (px1 < px0)
                ctx.transform(-1, 0, 0, 1, mapWidth, 0);
            if (py1 < py0)
                ctx.transform(1, 0, 0, -1, 0, mapHeight);
            ctx.drawImage(mapCanvas, 0, 0);
            ctx.restore();

            if (cfg.showColorScale !== false)
                drawColorScale(chart, g, colorScale, interpolate);
        }

        function drawColorScale(chart, g, colorScale, interpolate) {
            var cfg = g.cfg;
            var ctx = chart.ctx;
            var area = chart.chartArea;
            var barWidth = 12 * scaleFactor;
            var left = area.right + 10 * scaleFactor;
            var top = area.top, height = area.bottom - area.top;
            if (height < 10 || chart.width - area.right < 30 * scaleFactor) //a fixed plot area may leave no room for the bar
                return;
            ctx.save();
            var grad = ctx.createLinearGradient(0, area.bottom, 0, area.top);
            if (interpolate) {
                for (var i = 0; i < colorScale.length; i++) {
                    var c = colorScale[i];
                    grad.addColorStop(i / (colorScale.length - 1), rgbString(c));
                }
            } else {
                var n = colorScale.length - 1;
                for (var i = 0; i < n; i++) {
                    var c = colorScale[i + (i == n - 1 ? 1 : 0)];
                    //Stepped scale: each interval takes one color
                    var lo = colorScale[i], hi = colorScale[i + 1];
                    var s = rgbString(lo);
                    var e = rgbString(hi);
                    grad.addColorStop(i / n, s);
                    grad.addColorStop((i + 0.5) / n - 0.0001, s);
                    grad.addColorStop((i + 0.5) / n, e);
                    grad.addColorStop((i + 1) / n, e);
                }
            }
            ctx.fillStyle = grad;
            ctx.fillRect(left, top, barWidth, height);
            ctx.strokeStyle = frameColor();
            ctx.lineWidth = scaleFactor;
            ctx.strokeRect(left, top, barWidth, height);

            ctx.fillStyle = frameColor();
            ctx.font = (12 * scaleFactor) + "px sans-serif";
            ctx.textBaseline = "middle";
            ctx.textAlign = "left";
            var labelX = left + barWidth + 4 * scaleFactor;
            ctx.fillText(formatG(g.mapZ.max, 3), labelX, top + 6 * scaleFactor);
            ctx.fillText(formatG(g.mapZ.min, 3), labelX, area.bottom - 6 * scaleFactor);
            var title = axisTitle(cfg.labelZ, cfg.unitZ);
            if (title) {
                ctx.translate(labelX + 8 * scaleFactor, (top + area.bottom) / 2);
                ctx.rotate(-Math.PI / 2);
                ctx.textAlign = "center";
                ctx.textBaseline = "top";
                ctx.fillText(title, 0, 0);
            }
            ctx.restore();
        }

        function drawPicks(chart, g) {
            if (!g.interactive || (g.picks.length == 0 && !g.preview))
                return;
            var ctx = chart.ctx;
            var xs = chart.scales.x, ys = chart.scales.y;
            var area = chart.chartArea;
            ctx.save();
            ctx.beginPath();
            ctx.rect(area.left, area.top, area.right - area.left, area.bottom - area.top);
            ctx.clip();
            var color = frameColor();
            var r = 6 * scaleFactor;
            if (g.preview && g.mode == "pick" && !g.picks.some(function(p) { return samePoint(p, g.preview); })) {
                //Hover preview: a faint marker and the point's values next to it
                var px = xs.getPixelForValue(g.preview.x), py = ys.getPixelForValue(g.preview.y);
                ctx.globalAlpha = 0.6;
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5 * scaleFactor;
                ctx.beginPath();
                ctx.arc(px, py, r, 0, 2 * Math.PI);
                ctx.stroke();
                var text = withUnit(formatValue(g.preview.x, g.cfg.xPrecision), g.cfg.unitX) + ", " + withUnit(formatValue(g.preview.y, g.cfg.yPrecision), g.cfg.unitY);
                ctx.font = (12 * scaleFactor) + "px sans-serif";
                ctx.textBaseline = "middle";
                var tw = ctx.measureText(text).width;
                var tx = px + 12 * scaleFactor;
                if (tx + tw + 6 * scaleFactor > area.right)
                    tx = px - 12 * scaleFactor - tw;
                ctx.globalAlpha = 0.85;
                ctx.fillStyle = overlayBackground();
                ctx.fillRect(tx - 3 * scaleFactor, py - 9 * scaleFactor, tw + 6 * scaleFactor, 18 * scaleFactor);
                ctx.fillStyle = color;
                ctx.textAlign = "left";
                ctx.fillText(text, tx, py);
                ctx.globalAlpha = 1;
            }
            var pts = g.picks.map(function(p) { return {x: xs.getPixelForValue(p.x), y: ys.getPixelForValue(p.y)}; });
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5 * scaleFactor;
            if (pts.length == 2) {
                ctx.setLineDash([4 * scaleFactor, 4 * scaleFactor]);
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[1].x, pts[1].y);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            pts.forEach(function(p) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(p.x - 2 * r, p.y); ctx.lineTo(p.x - r, p.y);
                ctx.moveTo(p.x + r, p.y); ctx.lineTo(p.x + 2 * r, p.y);
                ctx.moveTo(p.x, p.y - 2 * r); ctx.lineTo(p.x, p.y - r);
                ctx.moveTo(p.x, p.y + r); ctx.lineTo(p.x, p.y + 2 * r);
                ctx.stroke();
            });
            ctx.restore();
        }

        function drawStatus(chart, g) {
            if (g.status == "ok")
                return;
            var text = g.status == "noData" ? graphStrings.noData : (g.status == "noValidData" ? graphStrings.noValidData : graphStrings.noDataInRange);
            var ctx = chart.ctx;
            var area = chart.chartArea;
            var cx = (area.left + area.right) / 2, cy = (area.top + area.bottom) / 2;
            ctx.save();
            ctx.fillStyle = frameColor();
            ctx.font = (15 * scaleFactor) + "px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, cx, cy);
            if (g.status == "noDataInRange" && g.nearest) {
                //Arrow towards the nearest valid point outside the visible range
                var px = chart.scales.x.getPixelForValue(g.nearest.x);
                var py = chart.scales.y.getPixelForValue(g.nearest.y);
                var dx = px - cx, dy = py - cy;
                var len = Math.sqrt(dx * dx + dy * dy);
                if (len > 0) {
                    dx /= len; dy /= len;
                    var l = 30 * scaleFactor;
                    var sx = cx + dx * 20 * scaleFactor, sy = cy + dy * 20 * scaleFactor + 12 * scaleFactor;
                    var ex = sx + dx * l, ey = sy + dy * l;
                    ctx.strokeStyle = frameColor();
                    ctx.lineWidth = 2 * scaleFactor;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(ex, ey);
                    ctx.lineTo(ex - (dx * 0.866 - dy * 0.5) * 8 * scaleFactor, ey - (dy * 0.866 + dx * 0.5) * 8 * scaleFactor);
                    ctx.moveTo(ex, ey);
                    ctx.lineTo(ex - (dx * 0.866 + dy * 0.5) * 8 * scaleFactor, ey - (dy * 0.866 - dx * 0.5) * 8 * scaleFactor);
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        Chart.register({
            id: "phyphox",
            beforeDatasetsDraw: function(chart) {
                var g = chart.phyphoxGraph;
                if (g && g.isMap)
                    drawColorMap(chart, g);
            },
            afterDatasetsDraw: function(chart) {
                var g = chart.phyphoxGraph;
                var ctx = chart.ctx;
                var area = chart.chartArea;
                ctx.save();
                ctx.strokeStyle = frameColor();
                ctx.lineWidth = scaleFactor;
                ctx.strokeRect(area.left, area.top, area.right - area.left, area.bottom - area.top);
                ctx.restore();
                if (g) {
                    drawPicks(chart, g);
                    drawStatus(chart, g);
                    if (g.plotArea)
                        drawTitle(chart, g);
                }
            }
        });

        //With a fixed plot area the label is drawn into the top margin, if there is room for it
        function drawTitle(chart, g) {
            var area = chart.chartArea;
            var font = 15 * scaleFactor;
            if (area.top < font * 1.4 || !g.ve.label)
                return;
            var ctx = chart.ctx;
            ctx.save();
            ctx.fillStyle = frameColor();
            ctx.font = "bold " + font + "px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "bottom";
            ctx.fillText(g.ve.label, (area.left + area.right) / 2, area.top - font * 0.3);
            ctx.restore();
        }

        //Read-only view of a graph's state for the test suite (test/webinterface.test.js)
        function state(index) {
            var g = graphs[index];
            if (!g)
                return null;
            return {
                plotArea: g.plotArea,
                status: g.status,
                mode: g.mode,
                interactive: g.interactive,
                follow: g.follow,
                logX: g.logX,
                logY: g.logY,
                userRange: g.userRange,
                picks: g.picks.map(function(p) { return {datasetIndex: p.datasetIndex, index: p.index, x: p.x, y: p.y}; }),
                preview: g.preview ? {datasetIndex: g.preview.datasetIndex, index: g.preview.index} : null,
                pointCounts: g.chart ? g.chart.data.datasets.map(function(d) { return d.data.length; }) : null
            };
        }

        return {
            state: state,
            prepareElement: prepareElement,
            attachToDOM: attachToDOM,
            destroyAll: destroyAll,
            setInteractive: setInteractive,
            tool: tool,
            pickOutput: pickOutput,
            commitCal: commitCal,
            cancelCal: cancelCal,
            clearPicks: clearPicks,
            onMeasuringChanged: onMeasuringChanged
        };
    })();
    </script>
</head>

<body>
<div id="header">
    <img id="logo" src="logo" />
    <div id="titleBar">
        <h1 id="title"><!-- [[title]] --></h1>
    </div>
    <div id="buttons">
        <div id="countdown"></div><div id="measuring" onclick="toggleMeasuring()"></div><div id="clear" onclick="clearData()"></div><div id="more" onclick="toggleMenu(event)">
            <ul id="moreMenu">
                <li id="export" onclick="exportData()"><!-- [[exportTranslation]] --></li>
                <li id="switchToPhoneLayout" onclick="switchToPhoneLayout()"><!-- [[switchToPhoneLayoutTranslation]] --></li>
                <li id="switchColumns1" onclick="switchColumns(1)"><!-- [[switchColumns1Translation]] --></li>
                <li id="switchColumns2" onclick="switchColumns(2)"><!-- [[switchColumns2Translation]] --></li>
                <li id="switchColumns3" onclick="switchColumns(3)"><!-- [[switchColumns3Translation]] --></li>
                <li id="toggleBrightMode" onclick="toggleBrightMode()"><!-- [[toggleBrightModeTranslation]] --><span class="circleButton" id="brightModeCheck">&nbsp;</span></li>
                <li class="moreButtons"><!-- [[fontSizeTranslation]] --><span class="circleButton" id="larger" onclick="zoomSmaller(event)">&minus;</span><span class="circleButton" id="default" onclick="zoomDefault(event)">1</span><span  class="circleButton" id="smaller" onclick="zoomLarger(event)">+</span></li>
            </ul>
        </div>
    </div>

</div>
<div id="viewSelectorBar">
    <ul id="viewSelector">
        <!-- [[viewOptions]] -->
    </ul>
</div>
<div id="views"></div>
<div id="error">No error.</div>
<div id="exportDialog" style="display:none;">
    <form method="get" action="export" target="_blank">
        <select name="format">
            <!-- [[exportFormatOptions]] -->
        </select>
        <input type="submit" value="Download Data" />
        <input type="button" onclick="hideExport()" value="Cancel" />
    </form>
</div>
</body>
</html>
