    <script>
    <!-- [[viewLayout]] -->
    var sessionID = "";
    var currentView = 0;
    var usedVarStr = "";

    var data = {};
    var elementData = [];
    var nViews = views.length;
    //Elements nest in view groups (file format 1.21): a group has an "elements" array and no index, leaves keep
    //a global sequential index in document order. forEachElement walks groups and leaves depth first.
    function forEachElement(elements, fn) {
        elements.forEach(function(ve) {
            fn(ve);
            if (ve.elements)
                forEachElement(ve.elements, fn);
        });
    }
    var nElements = 0;
    views.forEach(function(view) {
        forEachElement(view.elements, function(ve) {
            if (!ve.elements)
                nElements = Math.max(nElements, 1*ve.index + 1);
        });
    });
    var groupCount = 0;
    views.forEach(function(view) {
        forEachElement(view.elements, function(ve) {
            if (ve.elements)
                ve.groupId = "group" + (groupCount++);
        });
    });

    var measuring = true;
    var countDown = 0;
    var forceFull = false;

    var scaleFactor = 1.0;
    var brightMode = false;

    var body, header, viewsNode, viewSelector, exportDialog, moreMenu, errorNode;

    //Translated strings used by the graph module. The app replaces the placeholder line below with an
    //assignment of the same shape; anything it leaves out falls back to these English defaults.
    var graphStrings = {
        panAndZoom: "Pan and zoom",
        pick: "Pick data",
        resetZoom: "Reset zoom",
        follow: "Follow new data",
        logX: "Logarithmic x axis",
        logY: "Logarithmic y axis",
        systemTime: "Convert to system time",
        point: "Point",
        difference: "Difference",
        slope: "Slope",
        noData: "No data",
        noValidData: "No valid data",
        noDataInRange: "No data in range",
        ok: "OK",
        cancel: "Cancel",
        invalidValue: "Invalid value",
        zoomHint: "Mouse: drag to pan, hold shift and drag to zoom into a region, wheel to zoom. Touch: pinch to zoom, drag to pan.",
        colorMapWarning: "The color plot in the remote interface is only an approximation. In contrast to the in-app plot, at the moment it cannot handle non-equidistant data or logarithmic scaling on the x and y axis. So, data at varying intervals may appear at the wrong location."
    };
    <!-- [[graphStrings]] -->

    //Store settings to cookie
    function saveSetting(name, value) {
        document.cookie = name + "=" + value;
    }

    //Restore settings from cookie
    function getSetting(name) {
        var regex = new RegExp("[; ]"+name+"=([^\\s;]*)");
        var m = (";"+document.cookie).match(regex);
        if (m != null && m.length > 1)
            return m[1];
        else
            return null;
    }

    //Color helpers
    //https://stackoverflow.com/a/17243070/8068814
    function HSVtoRGB(hsv) {
        var r, g, b, i, f, p, q, t, h, s, v;
        h = hsv.h;
        s = hsv.s;
        v = hsv.v;
        i = Math.floor(h * 6);
        f = h * 6 - i;
        p = v * (1 - s);
        q = v * (1 - f * s);
        t = v * (1 - (1 - f) * s);
        switch (i % 6) {
            case 0: r = v, g = t, b = p; break;
            case 1: r = q, g = v, b = p; break;
            case 2: r = p, g = v, b = t; break;
            case 3: r = p, g = q, b = v; break;
            case 4: r = t, g = p, b = v; break;
            case 5: r = v, g = p, b = q; break;
        }
        var rgb = Math.round(r * 255) * 256 * 256 + Math.round(g * 255) * 256 + Math.round(b * 255);
        var hex = "#"+ ('000000' + ((rgb)>>>0).toString(16)).slice(-6);
        if (hsv.a != null && hsv.a < 1)
            hex += ('00' + Math.round(hsv.a * 255).toString(16)).slice(-2);
        return hex;
    }

    //"#rrggbb", "#rrggbbaa" (file format 1.21), "rgb(r, g, b)" or "rgba(r, g, b, a)" to {r, g, b, a}, a in 0..1
    function stringToRGB(rgb) {
        var r,g,b,a = 1;
        if (rgb.indexOf("(") >= 0) {
            var rgbsep = rgb.replace(/[^\d,.]/g, '').split(',');
            r = parseInt(rgbsep[0]);
            g = parseInt(rgbsep[1]);
            b = parseInt(rgbsep[2]);
            if (rgbsep.length > 3)
                a = parseFloat(rgbsep[3]);
        } else {
            var hex = rgb.charAt(0) == "#" ? rgb.slice(1) : rgb;
            var i = parseInt(hex.slice(0, 6), 16);
            r = (i >> 16) & 255;
            g = (i >> 8) & 255;
            b = i & 255;
            if (hex.length == 8)
                a = parseInt(hex.slice(6, 8), 16) / 255;
        }
        return {r:r, g:g, b:b, a:a};
    }

    function rgbString(c) {
        return c.a == null || c.a >= 1 ? "rgb(" + c.r + "," + c.g + "," + c.b + ")" : "rgba(" + c.r + "," + c.g + "," + c.b + "," + c.a + ")";
    }

    function RGBtoHSV(rgb) {
        var r = rgb.r;
        var g = rgb.g;
        var b = rgb.b;

        var max = Math.max(r, g, b), min = Math.min(r, g, b),
            d = max - min,
            h,
            s = (max === 0 ? 0 : d / max),
            v = max / 255;

        switch (max) {
            case min: h = 0; break;
            case r: h = (g - b) + d * (g < b ? 6: 0); h /= 6 * d; break;
            case g: h = (b - r) + d * 2; h /= 6 * d; break;
            case b: h = (r - g) + d * 4; h /= 6 * d; break;
        }

        return {
            h: h,
            s: s,
            v: v
        };
    }

    //Convert colors if in bright mode
    function adjustableColor(c) {
        if (brightMode) {
            //Convert to HSV, to HSL, invert Lightness and convert back to HSL and HSV
            var rgb = stringToRGB(c);
            if (rgb.r == 0x20 && rgb.g == 0x20 && rgb.b == 0x20)
                return "#ffffff";
            var hsv = RGBtoHSV(rgb);
            hsv.a = rgb.a; //the alpha byte survives the adjustment
            var l = (2.0 - hsv.s) * hsv.v / 2.0;
            var s = l && l<1 ? hsv.s*hsv.v/(l < 0.5 ? l*2.0 : 2.0 - l*2.0) : 0.0

            //See Android or iOS source
            let lum = 0.2126*Math.pow((rgb.r/255.0+0.055)/1.055, 2.4) + 0.7152*Math.pow((rgb.g/255.0+0.055)/1.055, 2.4) + 0.0722*Math.pow((rgb.b/255.0+0.055)/1.055, 2.4);
            let pivot = 0.21404114; //Math.pow((0.5+0.055)/1.055, 2.4);
            var gammaL = pivot * (1 - lum) / (1 - pivot);
            if (gammaL < 0)
                gammaL = 0.0;
            l = 1.055 * Math.pow(gammaL, 1.0/2.4) - 0.055;
            if (l < 0)
                l = 0;
            else if (l > 1)
                l = 1;

            var t = s * (l < 0.5 ? l : 1.0-l);
            hsv.v = l+t;
            hsv.s = l > 0 ? 2*t/hsv.v : 0.0;
            return HSVtoRGB(hsv);
        } else {
            return c;
        }
    }

    function adjustColors() {
        var adjustables = document.getElementsByClassName("adjustableColor");
        for(var i = 0; i < adjustables.length; i++) {
            var adjustable = adjustables[i];
            if (adjustable.style.color !== "" && adjustable.style.color !== null)
                adjustable.style.color = adjustableColor(adjustable.style.color);
            if (adjustable.style.backgroundColor !== "" && adjustable.style.backgroundColor !== null)
                adjustable.style.backgroundColor = adjustableColor(adjustable.style.backgroundColor);
        }
    }

    //We implement a simple queue for ajax to avoid concurrent requests as phyphox is not designed for parallel handling of http requests
    var ajaxRequestQueue = [];
    var ajaxRequestRunning = false;
    var fatalStop = false;
    function ajax(url, success, fail, always, timeout) {
        ajaxRequest("GET", url, null, success, fail, always, timeout);
    }

    //POST with a JSON body, for the endpoints that take structured data (/set)
    function ajaxPostJSON(url, bodyObject, success, fail, always, timeout) {
        ajaxRequest("POST", url, JSON.stringify(bodyObject), success, fail, always, timeout);
    }

    function ajaxRequest(method, url, body, success, fail, always, timeout) {
        if (fatalStop)
            return;

        var request = new XMLHttpRequest();

        request.open(method, url, true);
        if (body !== null)
            request.setRequestHeader("Content-Type", "application/json");

        if (typeof timeout !== "undefined")
            request.timeout = timeout;
        else
            request.timeout = 3000;

        request.onreadystatechange = function() {
            if (request.readyState == 4) {
                var next = ajaxRequestQueue.shift();
                if (next && !fatalStop) {
                    setTimeout(function(){next.request.send(next.body)}, 10); //Add a short delay to avoid flooding the single-threaded webserver of phyphox
                } else
                    ajaxRequestRunning = false;

                //An exception in a callback must not stop the polling loop, so it is reported and swallowed
                try {
                    if (request.status >= 200 && request.status < 400) {
                        if (typeof success !== 'undefined' && success !== null) {
                            var parsed = null;
                            try {
                                parsed = JSON.parse(request.responseText);
                            } catch (e) {
                            }
                            success(parsed);
                        }
                    } else {
                        if (typeof fail !== 'undefined' && fail !== null)
                            fail();
                    }
                } catch (e) {
                    console.error(e);
                }
                if (typeof always !== 'undefined' && always !== null)
                    always();
            }
        };

        if (ajaxRequestRunning)
            ajaxRequestQueue.push({request: request, body: body});
        else {
            ajaxRequestRunning = true;
            request.send(body);
        }
    }

    function composeVarStr(name, partial, partialComponent) {
        var value; // empty (one sample) by default
        if (partial == "full") {
            value = "full";
        } else if (partial == "partial" || partial == "partialXYZ") {
            value = "full"; // fallback to full
            if (!forceFull && data.hasOwnProperty(partialComponent) && data.hasOwnProperty(name)) {
                var length = Math.min(data[partialComponent].data.length, data[name].data.length);
                if (length > 0) {
                    value = data[partialComponent].data[length - 1];
                    if (partialComponent !== name)
                        value += encodeURIComponent("|" + partialComponent);
                }
            }
        }
        return encodeURIComponent(name) + (value ? '=' + value : '');
    }

    function updateUsedVarStr() {
        var vars = {};
        var priorities = {};
        forEachElement(views[currentView].elements, function(ve) {
            if (ve.transformInputs) {
                ve.transformInputs.forEach(function(input) {
                    if (input.buffer == null)
                        return;
                    let key = "buffer:" + input.buffer;
                    if ((priorities[key] || 0) < 1) {
                        vars[key] = composeVarStr(input.buffer, "single");
                        priorities[key] = 1;
                    }
                });
            }
            if (ve.hasOwnProperty("dataInput")) {
                let dataInput = ve.dataInput;
                let updateMode = ve.updateMode;
                for (var i = 0; i < dataInput.length; i++) {
                    if (dataInput[i] == null)
                        continue;
                    let name = dataInput[i];
                    let key = "buffer:" + name;
                    let priority = priorities[key] || 0;
                    if (priority < 1 && (updateMode == "single" || updateMode == "input")) {
                        vars[key] = composeVarStr(name, "single");
                        priorities[key] = 1;
                    } else if (priority < 2 && updateMode == "partial") {
                        var dependentVar = ((dataInput.length > i + 1) && (i % 2 == 0)) ? dataInput[i + 1] : dataInput[i];
                        vars[key] = composeVarStr(name, "partial", dependentVar);
                        priorities[key] = 2;
                    } else if (priority < 3 && updateMode == "partialXYZ") {
                        var dependentVar = dataInput[Math.floor(i / 3)];
                        vars[key] = composeVarStr(name, "partialXYZ", dependentVar);
                        priorities[key] = 3;
                    } else if (priority < 4 && updateMode == "full") {
                        vars[key] = composeVarStr(name, "full");
                        priorities[key] = 4;
                    }
                }
            }

            if (ve.hasOwnProperty("visibilityInput")) {
                let visibilityInput = ve["visibilityInput"];
                if (visibilityInput != null) {
                    let key = "buffer:" + visibilityInput;
                    let priority = priorities[key] || 0;
                    if (priority < 1) {
                        vars[key] = composeVarStr(visibilityInput, "single");
                        priorities[key] = 1;
                    }
                }
            }
        });

        usedVarStr = "";
        for (var v in vars) {
            if (usedVarStr != "")
                usedVarStr += "&";
            usedVarStr += vars[v];
        }
        forceFull = false;
    }

    function nullToNaN(array) {
        for (var i = 0; i < array.length; i++) {
            if (array[i] == null) {
              array[i] = NaN;
            }
        }
        return array;
    }

    function updateData() {
        updateUsedVarStr();
        ajax("get?" + usedVarStr,
            function(response) {
                for (var name in response.buffer) {
                    let buffer = response.buffer[name];
                    let existing = data[name];
                    if (buffer.updateMode == "partial" && existing && existing.data.length > 0) {
                        if (buffer.buffer.length == 0) {
                            existing.changed = false;
                            continue;
                        }
                        existing.data = existing.data.concat(nullToNaN(buffer.buffer));
                        if (buffer.size > 0)
                            existing.data.splice(0, existing.data.length - buffer.size);
                        existing.changed = true;
                    } else {
                        data[name] = {
                            data: nullToNaN(buffer.buffer),
                            changed: true
                        };
                    }
                }
                updateViews();
                updateMeasuring(response.status);
                errorNode.style.display = "none";
            },
            function() {
                errorNode.textContent = "Update failed! Please check your connection.";
                errorNode.style.display = "block";
                forceFull = true;
            },
            function() {
                setTimeout(updateData, measuring ? 30 : 250);
            },
            10000
        );
    }

    function toggleMeasuring() {
        if (measuring || countDown != 0)
            ajax("control?cmd=stop");
        else
            ajax("control?cmd=start");
    }

    function updateMeasuring(s) {
        if (fatalStop)
            return;

        if (measuring != s.measuring) {
            forceFull = true;
            PhyphoxGraph.onMeasuringChanged(s.measuring);
        }
        if (sessionID == "")
            sessionID = s.session;
        else if (sessionID != s.session) {
            fatalStop = true;
            askSessionReload();
        }
        measuring = s.measuring;
        timedRun = s.timedRun;
        countDown = s.countDown;
        header.classList.toggle("active", measuring);
        header.classList.toggle("countdown", countDown != 0);
        if (countDown != 0) {
            document.getElementById("countdown").textContent = Math.ceil(countDown/1000) + "s";
        } else {
            document.getElementById("countdown").textContent = "";
        }
    }

    function askSessionReload() {
        if (window.confirm("The phyphox session has changed. Do you want to reload this window?"))
            window.location.reload(true);
    }

    //The DOM node of a leaf (element<index>) or a group (its groupId)
    function nodeOf(ve) {
        return document.getElementById(ve.elements ? ve.groupId : "element" + ve.index);
    }

    //The last value of a buffer in the data store, or null while it holds nothing
    function lastValue(name) {
        if (!data.hasOwnProperty(name))
            return null;
        let d = data[name]["data"];
        return d.length > 0 ? d[d.length-1] : null;
    }

    //A transform group: the properties from their inputs through the linear map, composed as scale, then
    //rotation, then translation about the origin (CSS applies the rightmost function first)
    function applyTransform(ve) {
        let node = nodeOf(ve);
        if (!node)
            return;
        let p = {scale: 1, scaleX: 1, scaleY: 1, translateX: 0, translateY: 0, rotate: 0, opacity: 1};
        ve.transformInputs.forEach(function(input) {
            let v = input.buffer != null ? lastValue(input.buffer) : input.value;
            if (v == null || !isFinite(v) || input.min == input.max)
                return;
            let m = input.mapMin + (v - input.min) * (input.mapMax - input.mapMin) / (input.max - input.min);
            if (input.clamp)
                m = Math.max(Math.min(input.mapMin, input.mapMax), Math.min(Math.max(input.mapMin, input.mapMax), m));
            p[input.as] = m;
        });
        node.style.transform = "translate(" + (100 * p.translateX) + "%, " + (100 * p.translateY) + "%) rotate(" + p.rotate + "rad) scale(" + (p.scale * p.scaleX) + ", " + (p.scale * p.scaleY) + ")";
        node.style.opacity = Math.max(0, Math.min(1, p.opacity));
    }

    function updateViews() {
        forEachElement(views[currentView].elements, function(ve) {
            if (ve.hasOwnProperty("dataInputFunction"))
                ve.dataInputFunction(data);
            if (ve.hasOwnProperty("dataCompleteFunction"))
                ve.dataCompleteFunction();
            if (ve.transformInputs)
                applyTransform(ve);

            if (ve.hasOwnProperty("visibilityInput") && data.hasOwnProperty(ve["visibilityInput"])) {
                let visibilityBuffer = data[ve["visibilityInput"]]["data"];
                let visible = (visibilityBuffer.length > 0) && (visibilityBuffer[visibilityBuffer.length-1] > 0);
                let element = nodeOf(ve);
                if (!element)
                    return;
                if (!visible && (element.classList.contains("exclusive") || element.classList.contains("exclusivePath")))
                    leaveExclusive();
                element.style.display = visible ? (ve.elements ? "" : "block") : "none";
            }
        });
    }

    //The markup of a leaf, or of a group with its children. Groups are plain containers styled by their class;
    //the per-child styles (weights, grid columns) are applied by layoutGroups once the nodes exist.
    function elementHTML(ve) {
        if (!ve.elements)
            return ve.html;
        let style = "";
        if (ve.type == "transform")
            style = "transform-origin: " + (100 * (ve.originX != null ? ve.originX : 0.5)) + "% " + (100 * (ve.originY != null ? ve.originY : 0.5)) + "%;";
        let html = "<div class=\"groupElement group_" + ve.type + "\" id=\"" + ve.groupId + "\" style=\"" + style + "\">";
        ve.elements.forEach(function(child) {
            html += elementHTML(child);
        });
        return html + "</div>";
    }

    var gridObserver = (typeof ResizeObserver !== "undefined") ? new ResizeObserver(function(entries) {
        entries.forEach(function(entry) {
            layoutGrid(entry.target.phyphoxGroup);
        });
    }) : null;

    //A grid uses the smallest number of columns that keeps a column at or below maxWidth text line heights (the em
    //of the element) or, with maxWidthUnit "screen", multiples of the viewport's shorter side; the children are flex
    //items of a wrapping row, so with fillLastRow the ones of an incomplete last row grow across it
    function layoutGrid(ve) {
        let node = nodeOf(ve);
        if (!node)
            return;
        let unit = ve.maxWidthUnit == "screen" ? Math.min(window.innerWidth, window.innerHeight) : (parseFloat(getComputedStyle(node).fontSize) || 16);
        let width = node.clientWidth;
        let maxWidthPx = (ve.maxWidth > 0 ? ve.maxWidth : 25) * unit;
        let columns = Math.max(1, Math.ceil(width / maxWidthPx - 1e-6));
        ve.columns = columns;
        ve.elements.forEach(function(child) {
            let childNode = nodeOf(child);
            if (childNode)
                childNode.style.flex = (ve.fillLastRow ? "1" : "0") + " 0 " + (100 / columns) + "%";
        });
    }

    //A screen-unit grid follows the viewport, which can change without the grid's own width changing
    window.addEventListener("resize", function() {
        if (!views[currentView])
            return;
        forEachElement(views[currentView].elements, function(ve) {
            if (ve.elements && ve.type == "grid" && ve.maxWidthUnit == "screen")
                layoutGrid(ve);
        });
    });

    function layoutGroups() {
        forEachElement(views[currentView].elements, function(ve) {
            if (!ve.elements)
                return;
            let node = nodeOf(ve);
            if (!node)
                return;
            if (ve.type == "horizontal") {
                ve.elements.forEach(function(child) {
                    let childNode = nodeOf(child);
                    if (childNode)
                        childNode.style.flex = (child.weight != null ? child.weight : 1) + " 1 0";
                });
            } else if (ve.type == "grid") {
                node.phyphoxGroup = ve;
                layoutGrid(ve);
                if (gridObserver)
                    gridObserver.observe(node);
            }
        });
    }

    function recreateViews() {
        PhyphoxGraph.destroyAll();
        if (gridObserver)
            gridObserver.disconnect();
        viewsNode.innerHTML = "";
        for (i = 0; i < nElements; i++)
            elementData[i] = {};

        var html = "";
        views[currentView].elements.forEach(function(ve) {
            html += "<div class=\"elementBlock\">" + elementHTML(ve) + "</div>";
        });
        viewsNode.innerHTML = html;
        layoutGroups();
        forEachElement(views[currentView].elements, function(ve) {
            if (ve.hasOwnProperty("graph"))
                PhyphoxGraph.attachToDOM(ve);
        });
        adjustColors();
        forceFull = true;
    }

    function switchView(newView) {
        forceFull = true;
        leaveExclusive();
        currentView = newView;
        updateUsedVarStr();

        var liElements = viewSelector.getElementsByTagName("li");
        for (var i = 0; i < liElements.length; i++) {
            liElements[i].classList.toggle("active", i == currentView);
        }
        recreateViews();
    }

    function clearData() {
        const oldOverlay = document.body.querySelector('.clearOverlay');
        if (oldOverlay)
            document.body.removeChild(oldOverlay);

        const overlay = document.createElement('div');
        var prompt;
        if (clearGroups.length > 0)
            prompt = "<!-- [[clearConfirmTranslationSelect]] -->";
        else
            prompt = "<!-- [[clearConfirmTranslation]] -->";
        overlay.className = 'clearOverlay';
        overlay.innerHTML = `
          <div class="clearBox">
            <p>${prompt}</p>
            <div class="clearGroupList">
              ${clearGroups.map((item, index) => `
                <label class="clearGroup">
                  <input type="checkbox" value="${item}" id="chk-${index}">
                  <span>${item}</span>
                </label>
              `).join('')}
            </div>
            <div>
              <button type="button" id="clearOK"><!-- [[translationOK]] --></button>
              <button type="button" id="clearCancel"><!-- [[translationCancel]] --></button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);

        overlay.querySelector('#clearCancel').addEventListener('click', () => {
            document.body.removeChild(overlay);
        });

        overlay.querySelector('#clearOK').addEventListener('click', () => {
            const checkboxes = overlay.querySelectorAll('.clearGroupList input[type="checkbox"]:checked');
            const selectedValues = Array.from(checkboxes).map(cb => cb.value);
            document.body.removeChild(overlay);

            const params = new URLSearchParams();
            params.append("cmd", "clear");
            selectedValues.forEach((value, index) => {
                params.append(`clearGroup${index + 1}`, value);
            });
            ajax("control?"+params.toString());
            forceFull = true;
        });
    }

    function exportData() {
        if (countDown == 0)
            exportDialog.style.display = "block";
    }

    function hideExport() {
        exportDialog.style.display = "none";
    }

    function switchColumns(columns) {
        saveSetting("columns", columns);
        leaveExclusive();
        body.classList.remove("columns1");
        body.classList.remove("columns2");
        body.classList.remove("columns3");
        body.classList.remove("phone");
        body.classList.add("columns"+columns);
    }

    function switchToPhoneLayout() {
        saveSetting("columns", 0);
        leaveExclusive();
        body.classList.remove("columns1");
        body.classList.remove("columns2");
        body.classList.remove("columns3");
        body.classList.add("phone");
    }

    function setExclusive(i) {
        body.classList.add("exclusive");
        var elem = document.getElementById("element"+i);
        elem.classList.add("exclusive");
        //The groups on the way down to the element stay visible, their other children hide (style.css)
        for (var node = elem.parentNode; node && node != viewsNode; node = node.parentNode)
            if (node.classList.contains("groupElement"))
                node.classList.add("exclusivePath");
        PhyphoxGraph.setInteractive(i, true);
    }

    function leaveExclusive() {
        body.classList.remove("exclusive");

        var path = document.getElementsByClassName("exclusivePath");
        while (path.length > 0)
            path[0].classList.remove("exclusivePath");

        var elements = document.getElementsByClassName("exclusive");
        while (elements.length > 0) {
            var elem = elements[0];
            elem.classList.remove("exclusive");
            if (elem.id && elem.id.indexOf("element") == 0)
                PhyphoxGraph.setInteractive(parseInt(elem.id.substring(7)), false);
        }
    }

    function toggleExclusive(i) {
        var elem = document.getElementById("element"+i);
        if ((elem.classList && elem.classList.contains("exclusive")) || (elem.className.indexOf("exclusive") > -1))
            leaveExclusive();
        else
            setExclusive(i);
    }

    function zoom(e, factor) {
        leaveExclusive();
        scaleFactor = factor;
        saveSetting("scaleFactor", scaleFactor);
        body.style.fontSize = (100*scaleFactor)+"%";
        e.stopPropagation();
        recreateViews();
    }

    function zoomLarger(e) {
        if (scaleFactor < 3)
            zoom(e, scaleFactor * 1.2);
    }

    function zoomSmaller(e) {
        if (scaleFactor > 0.5)
            zoom(e, scaleFactor / 1.2);
    }

    function zoomDefault(e) {
        zoom(e, 1.0);
    }

    function toggleBrightMode(e) {
        brightMode = body.classList.toggle("brightMode");

        saveSetting("brightMode", brightMode);
        recreateViews();
    }

    function toggleMenu(e) {
        if (moreMenu.style.display == "none")
            moreMenu.style.display = "block";
        else
            moreMenu.style.display = "none";
        if (!e)
            e = window.event;
        e.stopPropagation();
    }

    function hideMenu() {
        moreMenu.style.display = "none";
    }

    function ready(fn) {
        if (document.attachEvent ? document.readyState === "complete" : document.readyState !== "loading") {
            fn();
        } else {
            document.addEventListener('DOMContentLoaded', fn);
        }
    }

    ready(function() {
        body = document.getElementsByTagName("body")[0];
        header = document.getElementById("header");
        viewsNode = document.getElementById("views");
        viewSelector = document.getElementById("viewSelector");
        exportDialog = document.getElementById("exportDialog");
        moreMenu = document.getElementById("moreMenu");
        errorNode = document.getElementById("error");

        brightMode = (getSetting("brightMode") == "true");
        body.classList.toggle("brightMode", brightMode);

        var sf = getSetting("scaleFactor");
        if (sf)
            scaleFactor = parseFloat(sf);
        body.style.fontSize = (100*scaleFactor)+"%";

        //Graph elements are entirely built here from the configuration the app provides
        views.forEach(function(view) {
            forEachElement(view.elements, function(ve) {
                if (ve.hasOwnProperty("graph"))
                    PhyphoxGraph.prepareElement(ve);
            });
        });

        if (nViews > 1) {
            body.classList.add("multiView");
        }
        body.addEventListener("click", hideMenu);
        hideMenu();

        var liElements = viewSelector.getElementsByTagName("li");
        for (var i = 0; i < liElements.length; i++) {
            function switchViewCaller(i) {
                return function() {switchView(i)};
            }
            liElements[i].addEventListener("click", switchViewCaller(i));
        }
        switchView(0);

        var columns = getSetting("columns");
        if (columns > 0)
            switchColumns(columns);
        else
            switchToPhoneLayout();

        exportDialog.getElementsByTagName("form")[0].addEventListener("submit", hideExport);

        updateData();
    });

    /*
     * Graphs
     *
     * The app describes each graph with a JSON object ("graph" in the view layout, see readme.md);
     * everything below turns that description into a Chart.js chart. The graphs follow the explicit
     * settings of the experiment file (data sources, styles, ranges, labels) but are otherwise an
     * independent representation of the data, built on what Chart.js and its zoom plugin offer, and
     * usable with a mouse as well as with touch.
     */
    var PhyphoxGraph = (function() {
        var graphs = {}; //index -> state of the graph element
        var timeEvents = null; //Response of /time, fetched when a time axis is shown as system time
        var timeEventsRequested = false;

        function fmt(s) {
            return s == null ? "" : String(s);
        }

        function escapeHTML(s) {
            return fmt(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function isFiniteNumber(v) {
            return typeof v === "number" && isFinite(v);
        }

        //Number formatting for tick labels: follows the app's rules (GraphView.formatTic).
        //precision < 0 picks the digits from the tick spacing, an explicit precision is used as
        //significant digits (or decimals when scientific notation is suppressed).
        function formatTickValue(value, ticks, precision, suppressScientific, log) {
            if (log) {
                //Logarithmic axes only label the 1, 2 and 5 of each decade, like the Chart.js default
                if (!(value > 0))
                    return "";
                var mantissa = value / Math.pow(10, Math.floor(Math.log10(value) + 1e-9));
                mantissa = Math.round(mantissa * 1e6) / 1e6;
                if (mantissa != 1 && mantissa != 2 && mantissa != 5 && mantissa != 10)
                    return "";
                if (precision >= 0)
                    return suppressScientific ? value.toFixed(precision) : formatFixedG(value, precision);
                return suppressScientific ? value.toFixed(value < 1 ? 6 : 0).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "") : formatG(value, 6);
            }
            if (precision >= 0) {
                if (suppressScientific)
                    return value.toFixed(precision);
                return formatFixedG(value, precision);
            }
            var abs = Math.abs(value);
            if (value != 0 && (abs >= 10000 || abs < 0.0001)) {
                if (suppressScientific)
                    return value.toFixed(abs < 1 ? 6 : 0);
                return formatG(value, 3);
            }
            var step = tickStep(ticks);
            var decimals = step > 0 ? Math.max(0, Math.ceil(-Math.log10(step) - 1e-9)) : 0;
            return value.toFixed(Math.min(decimals, 10));
        }

        function tickStep(ticks) {
            if (!ticks || ticks.length < 2)
                return 0;
            var step = Number.POSITIVE_INFINITY;
            for (var i = 1; i < ticks.length; i++) {
                var d = Math.abs(ticks[i].value - ticks[i-1].value);
                if (d > 0 && d < step)
                    step = d;
            }
            return isFinite(step) ? step : 0;
        }

        //printf("%.Ng") as Java prints it for an explicit precision: N significant digits, zeros kept
        function formatFixedG(value, digits) {
            digits = Math.max(1, digits);
            if (value == 0)
                return (0).toFixed(Math.max(0, digits - 1));
            var abs = Math.abs(value);
            if (abs < 1e-4 || abs >= Math.pow(10, digits))
                return value.toExponential(digits - 1);
            return value.toPrecision(digits);
        }

        //Roughly printf("%.Ng"): N significant digits, trailing zeros removed
        function formatG(value, digits) {
            if (value == 0)
                return "0";
            digits = Math.max(1, digits);
            var exp = Math.floor(Math.log10(Math.abs(value)));
            var s;
            if (exp < -4 || exp >= digits)
                s = value.toExponential(digits - 1).replace(/\.?0+e/, "e");
            else
                s = value.toPrecision(digits).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
            return s;
        }

        //Values shown to the user (tooltips, picks)
        function formatValue(value, precision) {
            if (!isFiniteNumber(value))
                return "-";
            if (precision >= 0)
                return value.toFixed(precision);
            return formatG(value, 6);
        }

        function withUnit(valueStr, unit) {
            return unit ? valueStr + " " + unit : valueStr;
        }

        //Unit of a slope dy/dx: the explicit unitYperX of the experiment, or one composed from the axis units
        function slopeUnit(cfg) {
            if (cfg.unitYX)
                return cfg.unitYX;
            var uy = fmt(cfg.unitY), ux = fmt(cfg.unitX);
            if (uy && ux)
                return uy + "/" + ux;
            if (ux)
                return "1/" + ux;
            return uy;
        }

        function axisTitle(label, unit) {
            var l = fmt(label);
            if (unit)
                l += " (" + unit + ")";
            return l;
        }

        function timezoneSuffix() {
            var offset = -new Date().getTimezoneOffset();
            var sign = offset < 0 ? "-" : "+";
            offset = Math.abs(offset);
            var h = Math.floor(offset / 60);
            var m = offset % 60;
            return " (UTC" + sign + h + ":" + (m < 10 ? "0" : "") + m + ")";
        }

        //Experiment time -> system time (seconds since 1970) using the events from /time
        function experimentToSystemTime(v, linearTime) {
            if (!timeEvents || timeEvents.length == 0)
                return null;
            var start = null;
            for (var i = 0; i < timeEvents.length; i++) {
                var ev = timeEvents[i];
                if (ev.event != "START")
                    continue;
                if (start == null || linearTime)
                    start = ev;
                if (linearTime)
                    break;
                if (ev.experimentTime <= v)
                    start = ev;
            }
            if (start == null)
                return null;
            return start.systemTime + (v - start.experimentTime);
        }

        function formatSystemTime(v, linearTime) {
            var t = experimentToSystemTime(v, linearTime);
            if (t == null)
                return formatG(v, 6);
            var date = new Date(t * 1000);
            var secondsOfDay = (date.getHours() * 60 + date.getMinutes()) * 60 + date.getSeconds();
            if (secondsOfDay == 0 && Math.abs(t - Math.round(t)) < 0.001)
                return date.toLocaleDateString();
            return date.toLocaleTimeString();
        }

        function requestTimeEvents(force) {
            if (timeEventsRequested && !force)
                return;
            timeEventsRequested = true;
            ajax("time", function(response) {
                if (!Array.isArray(response))
                    return;
                timeEvents = response;
                //Nothing else redraws a paused experiment, so refresh the axes that show a clock
                for (var i in graphs) {
                    var g = graphs[i];
                    if (g.systemTime && g.chart)
                        g.chart.update("none");
                }
            }, null, null, 5000);
        }

        //Colors of the plot chrome that switch with the bright mode
        function frameColor() {
            return adjustableColor("#ffffff");
        }

        function gridColor() {
            return brightMode ? "rgba(32,32,32,0.5)" : "rgba(255,255,255,0.5)";
        }

        function overlayBackground() {
            return brightMode ? "rgba(255,255,255,0.85)" : "rgba(32,32,32,0.85)";
        }

        /*
         * Element setup
         */

        //Called once per graph element before the views are built: installs html and the data
        //functions the generic code expects on every view element.
        function prepareElement(ve) {
            var cfg = ve.graph;
            var index = parseInt(ve.index);
            var g = {
                index: index,
                ve: ve,
                cfg: cfg,
                chart: null,
                buffers: {}, //name -> array (references into the global data store)
                changed: false,
                interactive: false,
                mode: "zoom", //or "pick"
                userRange: {x: null, y: null}, //ranges set by the user via zoom/pan, null = automatic
                follow: !!cfg.followX,
                followWindow: null, //width of the followed window when the user switched follow on without a configured one
                logX: !!cfg.logX,
                logY: !!cfg.logY,
                systemTime: !!cfg.systemTime,
                picks: [], //up to two {datasetIndex, index, x, y, z}
                preview: null, //nearest point under the mouse in pick mode
                pendingCal: null, //pick output waiting for a user value
                status: "noData",
                nearest: null,
                range: null, //last computed ranges {x: {min,max}, y: {min,max}, z: {min,max}}
                isMap: cfg.datasets.length > 0 && cfg.datasets[0].style == "map",
                aspectRatio: cfg.aspectRatio > 0 ? cfg.aspectRatio : 2.5,
                //plotLeft & co. (file format 1.21) pin the plot area to fractions of the element; null = automatic
                plotArea: (cfg.plotLeft != null || cfg.plotTop != null || cfg.plotRight != null || cfg.plotBottom != null) ? {
                    left: cfg.plotLeft != null ? cfg.plotLeft : 0,
                    top: cfg.plotTop != null ? cfg.plotTop : 0,
                    right: cfg.plotRight != null ? cfg.plotRight : 1,
                    bottom: cfg.plotBottom != null ? cfg.plotBottom : 1
                } : null
            };
            graphs[index] = g;
            if (g.systemTime)
                requestTimeEvents(false);

            ve.html = buildHTML(g);
            ve.dataInputFunction = function(dataStore) {
                g.buffers = {};
                g.changed = false;
                cfg.datasets.forEach(function(ds) {
                    ["x", "y", "z"].forEach(function(axis) {
                        var name = ds[axis];
                        if (name == null)
                            return;
                        if (!dataStore.hasOwnProperty(name)) {
                            g.buffers = null;
                            return;
                        }
                        g.buffers[name] = dataStore[name];
                        if (dataStore[name].changed)
                            g.changed = true;
                    });
                });
                if (g.buffers === null)
                    g.changed = false;
            };
            ve.dataCompleteFunction = function() {
                if (g.buffers === null)
                    return;
                if (!g.changed && g.chart)
                    return;
                updateChart(g);
            };
        }

        function buildHTML(g) {
            var cfg = g.cfg;
            var labelSize = g.ve.labelSize ? g.ve.labelSize / 0.4 : 105;
            var html = "<div style=\"font-size:" + labelSize + "%;\" class=\"graphElement" + (g.plotArea ? " fixedPlotArea" : "") + "\" id=\"element" + g.index + "\">";
            //With a fixed plot area the fractions refer to the whole element, so the label row goes and the
            //label is drawn into the top margin of the plot when there is room (see the plugin)
            if (g.ve.label) //no title row without a label (file format 1.21); a click on the plot still maximizes
                html += "<span class=\"label\" onclick=\"toggleExclusive(" + g.index + ");\">" + escapeHTML(g.ve.label) + "</span>";
            if (g.isMap)
                html += "<div class=\"warningIcon\" title=\"" + escapeHTML(graphStrings.colorMapWarning) + "\" onclick=\"alert(this.title)\"></div>";
            html += "<div class=\"graphToolbar\">";
            html += toolButton(g, "zoom", graphStrings.panAndZoom, "mode");
            html += toolButton(g, "pick", graphStrings.pick, "mode");
            html += toolButton(g, "reset", graphStrings.resetZoom, "action");
            html += toolButton(g, "follow", graphStrings.follow, "toggle");
            if (cfg.logX && !g.isMap)
                html += toolButton(g, "logX", graphStrings.logX, "toggle");
            if (cfg.logY && !g.isMap)
                html += toolButton(g, "logY", graphStrings.logY, "toggle");
            if (cfg.timeOnX || cfg.timeOnY)
                html += toolButton(g, "systemTime", graphStrings.systemTime, "toggle");
            html += "<span class=\"graphHint\">" + escapeHTML(graphStrings.zoomHint) + "</span>";
            html += "</div>";
            html += "<div class=\"graphBox\"><div class=\"graphRatio\" style=\"padding-top: " + (100.0 / g.aspectRatio) + "%\"></div>";
            html += "<div class=\"graph\"><canvas></canvas></div>";
            html += "<div class=\"graphInfo\" style=\"display:none;\"></div>";
            html += "</div>";
            html += "</div>";
            return html;
        }

        function toolButton(g, tool, text, kind) {
            return "<button type=\"button\" class=\"graphTool graphTool_" + tool + "\" data-tool=\"" + tool + "\" data-kind=\"" + kind + "\" onclick=\"PhyphoxGraph.tool(" + g.index + ", '" + tool + "', event)\">" + escapeHTML(text) + "</button>";
        }

        //Called after the html has been placed in the document
        function attachToDOM(ve) {
            var g = graphs[parseInt(ve.index)];
            if (!g)
                return;
            g.chart = null;
            g.buffers = {};
            g.nearest = null;
            g.infoHTML = null;
            g.picks = [];
            g.pendingCal = null;
            updateToolbar(g);
        }

        function destroyAll() {
            for (var i in graphs) {
                var g = graphs[i];
                if (g.chart) {
                    g.chart.destroy();
                    g.chart = null;
                }
                g.interactive = false;
            }
        }

        function element(g) {
            return document.getElementById("element" + g.index);
        }

        function infoBox(g) {
            var el = element(g);
            return el ? el.getElementsByClassName("graphInfo")[0] : null;
        }

        /*
         * Data -> Chart.js datasets and axis ranges
         */

        function bufferArray(g, name) {
            if (name == null || !g.buffers || !g.buffers[name])
                return null;
            return g.buffers[name].data;
        }

        function buildDatasets(g) {
            var cfg = g.cfg;
            var result = [];
            var range = {
                x: {min: Number.POSITIVE_INFINITY, max: Number.NEGATIVE_INFINITY},
                y: {min: Number.POSITIVE_INFINITY, max: Number.NEGATIVE_INFINITY},
                z: {min: Number.POSITIVE_INFINITY, max: Number.NEGATIVE_INFINITY}
            };
            var hasAny = false; //any value at all
            var hasValid = false; //any point with finite x and y
            var logX = g.logX, logY = g.logY;

            cfg.datasets.forEach(function(ds, dsIndex) {
                var ys = bufferArray(g, ds.y);
                var xs = bufferArray(g, ds.x);
                var zs = bufferArray(g, ds.z);
                var points = [];
                if (ys) {
                    var n = ys.length;
                    if (xs)
                        n = Math.min(n, xs.length);
                    if (ds.style == "map" && zs)
                        n = Math.min(n, zs.length);
                    if (n > 0)
                        hasAny = true;
                    var lastX = null, lastY = null;
                    var lw = ds.lineWidth != null ? ds.lineWidth : 1.0;
                    for (var j = 0; j < n; j++) {
                        var x = xs ? xs[j] : j;
                        var y = ys[j];
                        var validX = isFiniteNumber(x) && (!logX || x > 0);
                        var validY = isFiniteNumber(y) && (!logY || y > 0);
                        if (isFiniteNumber(x) && isFiniteNumber(y))
                            hasValid = true;
                        if (validX) {
                            if (x < range.x.min) range.x.min = x;
                            if (x > range.x.max) range.x.max = x;
                        }
                        if (validY) {
                            if (y < range.y.min) range.y.min = y;
                            if (y > range.y.max) range.y.max = y;
                        }
                        if (ds.style == "vbars") {
                            //x is the left edge of a bar with height y; the bar ends where the next one starts
                            if (lastX !== null && lastY !== null && isFiniteNumber(x) && isFiniteNumber(lastX) && isFiniteNumber(lastY)) {
                                var offset = (x - lastX) * (1.0 - lw) / 2.0;
                                points.push({x: lastX + offset, y: lastY});
                                points.push({x: x - offset, y: lastY});
                                points.push({x: NaN, y: NaN});
                            }
                        } else if (ds.style == "hbars") {
                            if (lastX !== null && lastY !== null && isFiniteNumber(y) && isFiniteNumber(lastX) && isFiniteNumber(lastY)) {
                                var offset = (y - lastY) * (1.0 - lw) / 2.0;
                                points.push({x: lastX, y: lastY + offset});
                                points.push({x: lastX, y: y - offset});
                                points.push({x: NaN, y: NaN});
                            }
                        } else if (ds.style == "map") {
                            var z = zs ? zs[j] : NaN;
                            if (isFiniteNumber(z) && (!g.cfg.logZ || z > 0)) {
                                if (z < range.z.min) range.z.min = z;
                                if (z > range.z.max) range.z.max = z;
                            }
                            points.push({x: x, y: y, z: z});
                        } else {
                            points.push({x: x, y: y});
                        }
                        lastX = x;
                        lastY = y;
                    }
                }
                result.push(points);
            });

            g.range = range;
            g.hasAny = hasAny;
            g.hasValid = hasValid;
            return result;
        }

        //Axis range from the scale modes of the experiment, the data and the user's zoom
        function axisRange(g, axis) {
            var cfg = g.cfg;
            var upper = axis.toUpperCase();
            var log = axis == "x" ? g.logX : (axis == "y" ? g.logY : !!cfg.logZ);
            var dataMin = g.range[axis].min;
            var dataMax = g.range[axis].max;
            var hasData = dataMin <= dataMax;
            var modeMin = cfg["scaleMin" + upper] || "auto";
            var modeMax = cfg["scaleMax" + upper] || "auto";
            var cfgMin = cfg["min" + upper];
            var cfgMax = cfg["max" + upper];
            var min, max;

            //A range the user has set stays, in follow mode it keeps its width and moves with the data
            var user = axis != "z" ? g.userRange[axis] : null;
            if (user) {
                if (axis == "x" && g.follow && hasData) {
                    if (log)
                        return {min: dataMax / (user.max / user.min), max: dataMax};
                    return {min: dataMax - (user.max - user.min), max: dataMax};
                }
                return {min: user.min, max: user.max};
            }

            if (axis == "x" && g.follow) {
                //Follow: a window anchored at the newest data. Its width is the one configured with
                //followX, otherwise the width the plot had when the user switched follow on.
                if (isFiniteNumber(cfgMin) && isFiniteNumber(cfgMax) && cfgMax > cfgMin) {
                    if (hasData)
                        return {min: dataMax - (cfgMax - cfgMin), max: dataMax};
                    return {min: cfgMin, max: cfgMax};
                }
                if (g.followWindow && hasData) {
                    if (log && g.followWindow.ratio > 1)
                        return {min: dataMax / g.followWindow.ratio, max: dataMax};
                    if (!log && g.followWindow.width > 0)
                        return {min: dataMax - g.followWindow.width, max: dataMax};
                }
            }

            if (!hasData) {
                dataMin = log ? 1 : 0;
                dataMax = log ? 10 : 1;
                if (modeMin == "fixed" && isFiniteNumber(cfgMin) && modeMax != "fixed") { dataMin = cfgMin; dataMax = cfgMin; }
                if (modeMax == "fixed" && isFiniteNumber(cfgMax) && modeMin != "fixed") { dataMin = cfgMax; dataMax = cfgMax; }
            }

            //5% headroom at ends that follow the data
            var headMin = dataMin, headMax = dataMax;
            if (dataMax > dataMin) {
                if (log) {
                    var f = Math.pow(dataMax / dataMin, 0.05);
                    headMin = dataMin / f;
                    headMax = dataMax * f;
                } else {
                    var h = (dataMax - dataMin) * 0.05;
                    headMin = dataMin - h;
                    headMax = dataMax + h;
                }
            } else {
                //All values identical: open a small range around the value
                if (log) {
                    headMin = dataMin / 1.05;
                    headMax = dataMax * 1.05;
                } else if (dataMin == 0) {
                    headMin = -1;
                    headMax = 1;
                } else {
                    headMin = dataMin - Math.abs(dataMin) * 0.05;
                    headMax = dataMax + Math.abs(dataMax) * 0.05;
                }
            }

            if (modeMin == "fixed" && isFiniteNumber(cfgMin))
                min = cfgMin;
            else if (modeMin == "extend" && isFiniteNumber(cfgMin))
                min = Math.min(cfgMin, headMin);
            else
                min = headMin;

            if (modeMax == "fixed" && isFiniteNumber(cfgMax))
                max = cfgMax;
            else if (modeMax == "extend" && isFiniteNumber(cfgMax))
                max = Math.max(cfgMax, headMax);
            else
                max = headMax;

            if (log) {
                if (!(min > 0))
                    min = 1e-12;
                if (!(max > min))
                    max = min * 10;
            } else if (!(max > min)) {
                if (min == max) {
                    var d = Math.abs(min) * 0.05 || 1;
                    min -= d;
                    max += d;
                } else {
                    var t = min; min = max; max = t;
                }
            }
            return {min: min, max: max};
        }

        /*
         * Chart creation and update
         */

        //Fixed plot area: the top and right margins are layout padding, the left and bottom margins the sizes of
        //the axes (set in afterFit, which Chart.js runs on every layout, so a resize keeps the fractions)
        function plotAreaPadding(g, canvas) {
            var w = canvas ? canvas.clientWidth : 0, h = canvas ? canvas.clientHeight : 0;
            return {top: Math.round(g.plotArea.top * h), right: Math.round((1 - g.plotArea.right) * w), left: 0, bottom: 0};
        }

        function fitFixedPlotArea(g, scale) {
            var chart = scale.chart;
            var font = 15 * scaleFactor;
            var canvas = chart.canvas;
            var w = canvas.clientWidth, h = canvas.clientHeight;
            var pad = plotAreaPadding(g, canvas);
            if (chart.options.layout.padding.top != pad.top || chart.options.layout.padding.right != pad.right) {
                chart.options.layout.padding = pad;
                setTimeout(function() { if (g.chart) g.chart.update("none"); }, 0);
            }
            var room;
            if (scale.axis == "x") {
                room = Math.round((1 - g.plotArea.bottom) * h);
                scale.height = room;
            } else {
                room = Math.round(g.plotArea.left * w);
                scale.width = room;
            }
            //Tics and the title are dropped where they do not fit
            var rows = room / (font * 1.4);
            scale.options.ticks.display = rows >= 1;
            scale.options.title.display = rows >= 2 && scale.options.title.text != "";
        }

        function scaleOptions(g, axis) {
            var cfg = g.cfg;
            var log = axis == "x" ? g.logX : g.logY;
            var isTime = axis == "x" ? !!cfg.timeOnX : !!cfg.timeOnY;
            var systemTime = isTime && g.systemTime;
            var label = axis == "x" ? cfg.labelX : cfg.labelY;
            var unit = axis == "x" ? cfg.unitX : cfg.unitY;
            var precision = axis == "x" ? cfg.xPrecision : cfg.yPrecision;
            if (precision == null)
                precision = -1;
            var title = axisTitle(label, systemTime ? null : unit);
            if (systemTime)
                title += timezoneSuffix();
            var font = {size: 15 * scaleFactor};
            return {
                type: log ? "logarithmic" : "linear",
                position: axis == "x" ? "bottom" : "left",
                afterFit: g.plotArea ? function(scale) { fitFixedPlotArea(g, scale); } : undefined,
                grid: {
                    color: gridColor(),
                    tickLength: 0
                },
                border: {
                    color: gridColor(),
                    display: false
                },
                title: {
                    display: title != "",
                    text: title,
                    color: frameColor(),
                    font: font,
                    padding: 3 * scaleFactor
                },
                ticks: {
                    color: frameColor(),
                    font: font,
                    padding: 3 * scaleFactor,
                    autoSkip: true,
                    autoSkipPadding: 6 * scaleFactor,
                    maxTicksLimit: axis == "x" ? 10 : 7,
                    maxRotation: 0,
                    includeBounds: false,
                    callback: function(value, index, ticks) {
                        if (systemTime)
                            return formatSystemTime(value, !!cfg.linearTime);
                        return formatTickValue(value, ticks, precision, !!cfg.suppressScientificNotation, log);
                    }
                }
            };
        }

        function datasetOptions(g, ds, dsIndex) {
            var lw = ds.lineWidth != null ? ds.lineWidth : 1.0;
            var color = adjustableColor(ds.color || "#ff7e22");
            var style = ds.style || "lines";
            var bars = style == "vbars" || style == "hbars";
            return {
                type: "scatter",
                data: [],
                phyphoxStyle: style,
                showLine: style != "dots" && style != "map",
                fill: bars ? "origin" : false,
                pointRadius: style == "dots" ? 2.0 * lw * scaleFactor : 0,
                pointHitRadius: 0,
                pointHoverRadius: 0,
                tension: 0,
                borderCapStyle: "butt",
                borderJoinStyle: "round",
                spanGaps: false,
                borderColor: color,
                backgroundColor: color,
                borderWidth: bars ? 0 : lw * scaleFactor,
                xAxisID: "x",
                yAxisID: "y",
                order: dsIndex
            };
        }

        function zoomOptions(g) {
            var on = g.interactive && g.mode == "zoom";
            return {
                zoom: {
                    wheel: {enabled: on, speed: 0.1},
                    pinch: {enabled: on},
                    drag: {
                        enabled: on,
                        modifierKey: "shift",
                        threshold: 8,
                        backgroundColor: brightMode ? "rgba(32,32,32,0.2)" : "rgba(255,255,255,0.2)",
                        borderColor: frameColor(),
                        borderWidth: 1
                    },
                    mode: "xy",
                    scaleMode: "xy",
                    onZoom: function(ctx) { captureUserRange(g, ctx.chart); },
                    onZoomComplete: function(ctx) { onUserRangeChanged(g, ctx.chart); },
                    onZoomStart: function(ctx) {
                        //A drag with a finger pans; the zoom box is only drawn for the mouse
                        var e = ctx.event;
                        if (e && e.type == "mousedown" && e.pointerType && e.pointerType != "mouse")
                            return false;
                        return true;
                    }
                },
                pan: {
                    enabled: on,
                    mode: "xy",
                    scaleMode: "xy",
                    threshold: 5,
                    onPan: function(ctx) { captureUserRange(g, ctx.chart); },
                    onPanComplete: function(ctx) { onUserRangeChanged(g, ctx.chart); }
                }
            };
        }

        function usableRange(min, max) {
            return isFiniteNumber(min) && isFiniteNumber(max) && max > min && (max - min) > Math.max(Math.abs(min), Math.abs(max)) * 1e-9;
        }

        //Takes over the ranges the zoom plugin has set, on every step so that a data update arriving
        //during a gesture does not undo it; a degenerate range (e.g. from a flat drag) keeps the previous one
        function captureUserRange(g, chart) {
            var sx = chart.scales.x, sy = chart.scales.y;
            if (usableRange(sx.min, sx.max))
                g.userRange.x = {min: sx.min, max: sx.max};
            if (usableRange(sy.min, sy.max))
                g.userRange.y = {min: sy.min, max: sy.max};
        }

        function onUserRangeChanged(g, chart) {
            captureUserRange(g, chart);
            updateToolbar(g);
            updateChart(g);
        }

        function createChart(g) {
            var el = element(g);
            if (!el)
                return null;
            var canvas = el.getElementsByClassName("graph")[0].getElementsByTagName("canvas")[0];
            var cfg = g.cfg;
            var datasets = cfg.datasets.map(function(ds, i) { return datasetOptions(g, ds, i); });
            //Chart.js gets no pointer events at all: hover highlights and tooltips are off, the data
            //picker below reads the pointer itself and the zoom plugin has its own listeners
            var chart = new Chart(canvas, {
                type: "scatter",
                data: {datasets: datasets},
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    events: [],
                    layout: {padding: g.plotArea ? plotAreaPadding(g, canvas) : {right: (g.isMap && cfg.showColorScale !== false) ? 70 * scaleFactor : 0}},
                    plugins: {
                        legend: {display: false},
                        tooltip: {enabled: false},
                        zoom: zoomOptions(g)
                    },
                    scales: {
                        x: scaleOptions(g, "x"),
                        y: scaleOptions(g, "y")
                    }
                }
            });
            //The plugin below reads the live graph state from the chart itself: plugin options would
            //be copied by Chart.js at every update and go stale in between
            chart.phyphoxGraph = g;
            attachPicker(g, canvas);
            return chart;
        }

        function updateChart(g) {
            var cfg = g.cfg;
            var points = buildDatasets(g);

            if (!g.chart) {
                g.chart = createChart(g);
                if (!g.chart)
                    return;
            }
            var chart = g.chart;
            var mapRange = null;

            for (var i = 0; i < points.length; i++)
                chart.data.datasets[i].data = points[i];

            var rx = axisRange(g, "x");
            var ry = axisRange(g, "y");
            chart.options.scales.x.min = rx.min;
            chart.options.scales.x.max = rx.max;
            chart.options.scales.y.min = ry.min;
            chart.options.scales.y.max = ry.max;

            if (g.isMap) {
                var rz = axisRange(g, "z");
                g.mapZ = {min: rz.min, max: rz.max, log: !!cfg.logZ};
            }

            //Where does the data lie relative to the visible range?
            if (!g.hasAny)
                g.status = "noData";
            else if (!g.hasValid)
                g.status = "noValidData";
            else
                g.status = anyPointInRange(points, rx, ry, g) ? "ok" : "noDataInRange";

            //Picked points follow the data: keep the index, refresh the values
            g.picks = g.picks.filter(function(p) {
                var d = chart.data.datasets[p.datasetIndex] ? chart.data.datasets[p.datasetIndex].data : null;
                if (!d || p.index >= d.length)
                    return false;
                p.x = d[p.index].x;
                p.y = d[p.index].y;
                p.z = d[p.index].z;
                return true;
            });

            chart.update("none");
            updateInfo(g);
        }

        function anyPointInRange(points, rx, ry, g) {
            var nearestDist = Number.POSITIVE_INFINITY;
            var nearest = null;
            for (var i = 0; i < points.length; i++) {
                var d = points[i];
                for (var j = 0; j < d.length; j++) {
                    var p = d[j];
                    if (!isFiniteNumber(p.x) || !isFiniteNumber(p.y))
                        continue;
                    if (g.logX && !(p.x > 0) || g.logY && !(p.y > 0))
                        continue;
                    if (p.x >= rx.min && p.x <= rx.max && p.y >= ry.min && p.y <= ry.max) {
                        g.nearest = null;
                        return true;
                    }
                    //Track the point closest to the visible range for the hint arrow
                    var dx = p.x < rx.min ? (rx.min - p.x) / (rx.max - rx.min) : (p.x > rx.max ? (p.x - rx.max) / (rx.max - rx.min) : 0);
                    var dy = p.y < ry.min ? (ry.min - p.y) / (ry.max - ry.min) : (p.y > ry.max ? (p.y - ry.max) / (ry.max - ry.min) : 0);
                    var dist = dx * dx + dy * dy;
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearest = p;
                    }
                }
            }
            g.nearest = nearest;
            return false;
        }

        /*
         * Interaction
         */

        function setInteractive(index, interactive) {
            var g = graphs[index];
            if (!g)
                return;
            g.interactive = interactive;
            if (!interactive) {
                g.picks = [];
                g.pendingCal = null;
            }
            applyModeToChart(g);
            updateToolbar(g);
            if (g.chart) {
                //The element changes size when it is maximized; Chart.js follows the container
                setTimeout(function() { if (g.chart) g.chart.resize(); }, 0);
                updateChart(g);
            }
        }

        function applyModeToChart(g) {
            if (!g.chart)
                return;
            var chart = g.chart;
            var picking = g.interactive && g.mode == "pick";
            chart.options.plugins.zoom = zoomOptions(g);
            var canvas = chart.canvas;
            canvas.style.cursor = picking ? "crosshair" : (g.interactive ? "move" : "pointer");
            g.preview = null;
            chart.update("none");
            //A finger dragging between two points must not scroll or navigate the page. Set after the
            //update: the zoom plugin restarts Hammer.js in it, which writes touch-action itself and
            //keeps it at "none" while pinch and pan are enabled, so it is only overridden for picking.
            if (picking)
                canvas.style.touchAction = "none";
        }

        function tool(index, toolName, event) {
            var g = graphs[index];
            if (!g)
                return;
            if (event)
                event.stopPropagation();
            switch (toolName) {
                case "zoom":
                case "pick":
                    g.mode = toolName;
                    if (toolName == "zoom") {
                        g.picks = [];
                        g.pendingCal = null;
                    }
                    applyModeToChart(g);
                    break;
                case "reset":
                    g.userRange.x = null;
                    g.userRange.y = null;
                    break;
                case "follow":
                    g.follow = !g.follow;
                    g.followWindow = null;
                    if (g.follow && g.chart && !g.userRange.x) {
                        var sx = g.chart.scales.x;
                        if (usableRange(sx.min, sx.max))
                            g.followWindow = {width: sx.max - sx.min, ratio: sx.min > 0 ? sx.max / sx.min : 0};
                    }
                    break;
                case "logX":
                    g.logX = !g.logX;
                    g.userRange.x = null;
                    if (g.chart)
                        g.chart.options.scales.x = scaleOptions(g, "x");
                    break;
                case "logY":
                    g.logY = !g.logY;
                    g.userRange.y = null;
                    if (g.chart)
                        g.chart.options.scales.y = scaleOptions(g, "y");
                    break;
                case "systemTime":
                    g.systemTime = !g.systemTime;
                    if (g.systemTime)
                        requestTimeEvents(true);
                    if (g.chart) {
                        g.chart.options.scales.x = scaleOptions(g, "x");
                        g.chart.options.scales.y = scaleOptions(g, "y");
                    }
                    break;
            }
            updateToolbar(g);
            if (g.chart)
                updateChart(g);
        }

        function updateToolbar(g) {
            var el = element(g);
            if (!el)
                return;
            var buttons = el.getElementsByClassName("graphTool");
            for (var i = 0; i < buttons.length; i++) {
                var b = buttons[i];
                var t = b.getAttribute("data-tool");
                var active = false;
                switch (t) {
                    case "zoom": active = g.mode == "zoom"; break;
                    case "pick": active = g.mode == "pick"; break;
                    case "follow": active = g.follow; break;
                    case "logX": active = g.logX; break;
                    case "logY": active = g.logY; break;
                    case "systemTime": active = g.systemTime; break;
                    case "reset": b.disabled = !(g.userRange.x || g.userRange.y); break;
                }
                b.classList.toggle("active", active);
            }
            el.classList.toggle("pickMode", g.interactive && g.mode == "pick");
        }

        //The visible data point closest to a canvas position, measured on screen like in the app
        function nearestPointOnScreen(chart, pos) {
            var xs = chart.scales.x, ys = chart.scales.y;
            var best = null;
            var bestDist = Number.POSITIVE_INFINITY;
            for (var di = 0; di < chart.data.datasets.length; di++) {
                var ds = chart.data.datasets[di];
                var d = ds.data;
                for (var j = 0; j < d.length; j++) {
                    var p = d[j];
                    if (!isFiniteNumber(p.x) || !isFiniteNumber(p.y))
                        continue;
                    if (p.x < xs.min || p.x > xs.max || p.y < ys.min || p.y > ys.max)
                        continue;
                    var dx = xs.getPixelForValue(p.x) - pos.x;
                    var dy = ys.getPixelForValue(p.y) - pos.y;
                    var dist = dx * dx + dy * dy;
                    if (dist < bestDist) {
                        bestDist = dist;
                        best = {datasetIndex: di, index: j, x: p.x, y: p.y, z: p.z};
                    }
                }
            }
            if (best)
                best.distance = Math.sqrt(bestDist);
            return best;
        }

        function isPicking(g) {
            return g.interactive && g.mode == "pick" && g.chart;
        }

        function samePoint(a, b) {
            return a && b && a.datasetIndex == b.datasetIndex && a.index == b.index;
        }

        function canvasPosition(chart, e) {
            var r = chart.canvas.getBoundingClientRect();
            return {x: e.clientX - r.left, y: e.clientY - r.top};
        }

        function pickAt(g, pos) {
            var p = nearestPointOnScreen(g.chart, pos);
            return (p && p.distance <= 40 * scaleFactor) ? p : null;
        }

        function markerAt(g, pos) {
            var xs = g.chart.scales.x, ys = g.chart.scales.y;
            for (var i = 0; i < g.picks.length; i++) {
                var dx = xs.getPixelForValue(g.picks[i].x) - pos.x;
                var dy = ys.getPixelForValue(g.picks[i].y) - pos.y;
                if (Math.sqrt(dx * dx + dy * dy) < 14 * scaleFactor)
                    return i;
            }
            return -1;
        }

        function setPicks(g, picks) {
            g.picks = picks;
            g.pendingCal = null;
            g.chart.update("none");
            updateInfo(g);
        }

        //The data picker, like in the app: a tap or click selects the point nearest to it on screen,
        //one in empty space deselects, and dragging from a point to another spans the two for the
        //difference and slope read-out. With a mouse the nearest point is previewed while hovering.
        function attachPicker(g, canvas) {
            var drag = null;
            var previewPending = false;

            //A plot that is not maximized has no interaction of its own: a tap or click maximizes it
            canvas.addEventListener("click", function(e) {
                if (!g.interactive) {
                    e.stopPropagation();
                    toggleExclusive(g.index);
                }
            });

            function schedulePreview(pos) {
                g.preview = pickAt(g, pos);
                if (previewPending)
                    return;
                previewPending = true;
                requestAnimationFrame(function() {
                    previewPending = false;
                    if (g.chart)
                        g.chart.draw();
                });
            }

            canvas.addEventListener("pointerdown", function(e) {
                if (!isPicking(g) || (e.pointerType == "mouse" && e.button !== 0))
                    return;
                drag = {id: e.pointerId, start: canvasPosition(g.chart, e), moved: false, first: null};
                try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
                e.preventDefault();
            });

            canvas.addEventListener("pointermove", function(e) {
                if (!isPicking(g))
                    return;
                var pos = canvasPosition(g.chart, e);
                if (drag && drag.id == e.pointerId) {
                    if (!drag.moved) {
                        var ddx = pos.x - drag.start.x, ddy = pos.y - drag.start.y;
                        if (Math.sqrt(ddx * ddx + ddy * ddy) < 6 * scaleFactor)
                            return;
                        drag.moved = true;
                        //A drag that does not start at a point does nothing
                        drag.first = pickAt(g, drag.start);
                        if (!drag.first)
                            return;
                    }
                    if (!drag.first)
                        return;
                    drag.last = pos;
                    var second = pickAt(g, pos);
                    g.preview = null;
                    setPicks(g, second && !samePoint(second, drag.first) ? [drag.first, second] : [drag.first]);
                } else if (!drag && e.pointerType != "touch" && !e.buttons) {
                    schedulePreview(pos);
                }
            });

            function endDrag(e) {
                if (!drag || drag.id != e.pointerId)
                    return;
                var d = drag;
                drag = null;
                //The release event's position is not reliable for touch, so the press position
                //stands for a tap and the last move position for a drag
                if (d.moved) {
                    if (d.first && d.last) {
                        var last = pickAt(g, d.last);
                        setPicks(g, last && !samePoint(last, d.first) ? [d.first, last] : [d.first]);
                    }
                    return;
                }
                var pos = d.start;
                //A tap or click: remove the marker under it, else select the nearest point, else deselect
                var m = markerAt(g, pos);
                if (m >= 0) {
                    var picks = g.picks.slice();
                    picks.splice(m, 1);
                    setPicks(g, picks);
                    return;
                }
                var p = pickAt(g, pos);
                setPicks(g, p ? [p] : []);
            }

            canvas.addEventListener("pointerup", function(e) {
                if (!isPicking(g)) {
                    drag = null;
                    return;
                }
                endDrag(e);
            });
            canvas.addEventListener("pointercancel", function() { drag = null; });
            canvas.addEventListener("pointerleave", function() {
                if (g.preview) {
                    g.preview = null;
                    if (g.chart)
                        g.chart.draw();
                }
            });
        }

        //Info box: picked points, their difference and slope, the fit result and the pick outputs
        function updateInfo(g) {
            var box = infoBox(g);
            if (!box)
                return;
            var cfg = g.cfg;
            var lines = [];
            if (g.interactive && g.mode == "pick") {
                var clearButton = "<button type=\"button\" class=\"pickClear\" title=\"" + escapeHTML(graphStrings.cancel) + "\" onclick=\"PhyphoxGraph.clearPicks(" + g.index + ", event)\">&#x2715;</button>";
                g.picks.forEach(function(p, i) {
                    var s = (i == 0 ? clearButton : "") + escapeHTML(graphStrings.point) + ": " + escapeHTML(withUnit(formatValue(p.x, cfg.xPrecision), cfg.unitX)) + ", " + escapeHTML(withUnit(formatValue(p.y, cfg.yPrecision), cfg.unitY));
                    if (g.isMap && p.hasOwnProperty("z"))
                        s += ", " + escapeHTML(withUnit(formatValue(p.z, cfg.zPrecision), cfg.unitZ));
                    lines.push(s);
                });
                if (g.picks.length == 2) {
                    var dx = g.picks[1].x - g.picks[0].x;
                    var dy = g.picks[1].y - g.picks[0].y;
                    lines.push(escapeHTML(graphStrings.difference) + ": " + escapeHTML(withUnit(formatValue(dx, cfg.xPrecision), cfg.unitX)) + ", " + escapeHTML(withUnit(formatValue(dy, cfg.yPrecision), cfg.unitY)));
                    if (dx != 0)
                        lines.push(escapeHTML(graphStrings.slope) + ": " + escapeHTML(withUnit(formatG(dy / dx, 5), slopeUnit(cfg))));
                }
                if (g.picks.length > 0 && cfg.pickOutputs && cfg.pickOutputs.length > 0) {
                    var buttons = "";
                    cfg.pickOutputs.forEach(function(out, i) {
